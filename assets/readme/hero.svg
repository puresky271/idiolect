<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">idiolect：让 AI 说话像角色，并且能证明它变像了</title>
  <desc id="heroDesc">左侧是项目名与一句话说明：以《BanG Dream! It's MyGO!!!!!》五名成员为示例角色，从原作台词蒸馏长度、句数、口癖与场景分类，落进四层 prompt。右侧是真实探针记录：同一句「我今天一直在哭，快撑不住了」，爱音、灯、立希、素世、乐奈给出五种截然不同的回复。</desc>

  <defs>
    <clipPath id="bgClip"><rect width="1200" height="544" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#bgClip)">
    <rect width="1200" height="544" fill="#0b0e14"/>
    <rect x="0" y="0" width="6" height="544" fill="#6ea8fe"/>
  </g>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2.4" fill="#8b94a7">MYGO!!!!! FAN PROJECT · PROMPT ENGINEERING</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#e8ecf4">idiolect</text>
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#cfd6e4">让 AI 说话像角色，并且能证明它变像了</text>
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#8b94a7">以《BanG Dream! It's MyGO!!!!!》五名成员为示例角色：</text>
    <text x="0" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#8b94a7">从原作台词蒸馏长度、句数、口癖与场景差异，落进四层 prompt。</text>
    <text x="0" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6ea8fe">不做微调 · 不分发原作文本 · pip 安装即用</text>
    <text x="0" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">from idiolect.assemble import build_messages</text>
  </g>

  <g id="dialog-proof">
    <text x="524" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b94a7">同一句话 × 五个角色 · 真实探针输出</text>

    <rect x="820" y="72" width="292" height="42" rx="16" fill="#1f2740"/>
    <text x="966" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#cfd6e4">我今天一直在哭，快撑不住了</text>

    <!-- 爱音 -->
    <g transform="translate(0 130)">
      <circle cx="544" cy="29" r="7" fill="#ff8899"/>
      <text x="560" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">爱音</text>
      <rect x="640" y="0" width="420" height="58" rx="14" fill="#131826" stroke="#1f2740"/>
      <rect x="640" y="0" width="5" height="58" rx="2.5" fill="#ff8899"/>
      <text x="666" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">……纸巾。先拿着。</text>
      <text x="666" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">哭就哭吧，我陪着。</text>
    </g>

    <!-- 灯 -->
    <g transform="translate(0 204)">
      <circle cx="544" cy="29" r="7" fill="#77bbdd"/>
      <text x="560" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">灯</text>
      <rect x="640" y="0" width="420" height="58" rx="14" fill="#131826" stroke="#1f2740"/>
      <rect x="640" y="0" width="5" height="58" rx="2.5" fill="#77bbdd"/>
      <text x="666" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">············</text>
      <text x="666" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">我······也经常哭。</text>
    </g>

    <!-- 立希 -->
    <g transform="translate(0 278)">
      <circle cx="544" cy="29" r="7" fill="#7777aa"/>
      <text x="560" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">立希</text>
      <rect x="640" y="0" width="420" height="58" rx="14" fill="#131826" stroke="#1f2740"/>
      <rect x="640" y="0" width="5" height="58" rx="2.5" fill="#7777aa"/>
      <text x="666" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">好了。</text>
      <text x="666" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">去洗把脸，然后喝点水。</text>
    </g>

    <!-- 素世 -->
    <g transform="translate(0 352)">
      <circle cx="544" cy="29" r="7" fill="#ffdd88"/>
      <text x="560" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">素世</text>
      <rect x="640" y="0" width="420" height="58" rx="14" fill="#131826" stroke="#1f2740"/>
      <rect x="640" y="0" width="5" height="58" rx="2.5" fill="#ffdd88"/>
      <text x="666" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">……先别撑着。</text>
      <text x="666" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">来我家吧，今天妈妈不在。</text>
    </g>

    <!-- 乐奈 -->
    <g transform="translate(0 426)">
      <circle cx="544" cy="29" r="7" fill="#77dd77"/>
      <text x="560" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">乐奈</text>
      <rect x="640" y="0" width="420" height="58" rx="14" fill="#131826" stroke="#1f2740"/>
      <rect x="640" y="0" width="5" height="58" rx="2.5" fill="#77dd77"/>
      <text x="666" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">嗯。</text>
      <text x="666" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e8ecf4">猫。屋檐下面。</text>
    </g>

    <text x="524" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">输入与五条回复均为真实探针记录 · repo_standalone · 每角色 3 条取 1</text>
  </g>
</svg>
