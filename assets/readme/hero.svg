<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">idiolect：让 AI 说话像角色，并且能证明它变像了</title>
  <desc id="heroDesc">左侧是项目名与一句话说明：从原作台词蒸馏长度、句数、口癖与场景分类，落进四层 prompt。右侧是乐奈一次真实装配的 system prompt：长档案 12223 字、语气清单 1972 字、说话尺度 551 字、本轮指引 846 字，下方是这一步真实生成的回复。</desc>

  <defs>
    <clipPath id="bgClip"><rect width="1200" height="380" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#bgClip)">
    <rect width="1200" height="380" fill="#0b0e14"/>
    <rect x="0" y="0" width="6" height="380" fill="#6ea8fe"/>
  </g>

  <g id="title-block" transform="translate(64 62)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.6" fill="#8b94a7">FAN PROJECT · PROMPT ENGINEERING</text>
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#e8ecf4">idiolect</text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#cfd6e4">让 AI 说话像角色，并且能证明它变像了</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8b94a7">从原作台词蒸馏长度、句数、口癖与场景分类，落进四层 prompt。</text>
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8b94a7">配一套探针、评分与门禁，每一句话的改动都能被验证。</text>
    <text x="0" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6ea8fe">不做微调 · 不分发原作文本 · 130 个「角色 / 场景」基线</text>
  </g>

  <g id="layer-proof" transform="translate(696 48)">
    <rect width="440" height="284" rx="18" fill="#131826" stroke="#1f2740"/>
    <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b94a7">system prompt · 乐奈 · 找猫场景</text>

    <text x="24" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#cfd6e4">长档案</text>
    <rect x="122" y="62" width="236" height="14" rx="7" fill="#6ea8fe"/>
    <text x="416" y="76" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">12223</text>

    <text x="24" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#cfd6e4">语气清单</text>
    <rect x="122" y="96" width="42" height="14" rx="7" fill="#f0a6c0"/>
    <text x="416" y="110" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">1972</text>

    <text x="24" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#cfd6e4">说话尺度</text>
    <rect x="122" y="130" width="12" height="14" rx="6" fill="#d9b382"/>
    <text x="416" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">551</text>

    <text x="24" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#cfd6e4">本轮指引</text>
    <rect x="122" y="164" width="18" height="14" rx="7" fill="#a78bfa"/>
    <text x="416" y="178" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">846</text>

    <text x="24" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b94a7">条形按字数线性比例 · mock 白天 · 每格 3 次</text>

    <line x1="24" y1="212" x2="416" y2="212" stroke="#1f2740"/>

    <rect x="24" y="224" width="392" height="44" rx="14" fill="#0b0e14" stroke="#1f2740"/>
    <path d="M46 268 L46 278 L58 268 Z" fill="#1f2740"/>
    <text x="44" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#e8ecf4">「嗯。」「猫。屋檐下面。」</text>
  </g>

  <g id="footer-note" transform="translate(64 330)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b94a7">上面这张面板就是一次真实装配的全部内容</text>
  </g>
</svg>
