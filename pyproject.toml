[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "idiolect"
dynamic = ["version"]
description = "把角色的说话方式蒸馏成可验证的 prompt 约束，并对证据 grounding 与长上下文做可预注册的离线评测（示例角色：《BanG Dream! It's MyGO!!!!!》五人）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["prompt-engineering", "character-ai", "roleplay", "llm", "evaluation", "grounding",
            "long-context", "mutation-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 运行时零第三方依赖：idiolect/ 只用标准库。
# 探针、评分等工具链见 extras 与 requirements*.txt。
dependencies = []

# 装了包就有一个 `idiolect` 命令，等于 `python -m idiolect`。
# 这样 `uvx --from git+https://github.com/<owner>/idiolect idiolect prompt Rana "…"`
# 这种一行调用才成立（uv 会建一个临时环境，运行时零依赖）。
[project.scripts]
idiolect = "idiolect.__main__:main"

[project.optional-dependencies]
llm = ["openai>=1.40"]
tools = [
    "openai>=1.40",
    "numpy>=1.24",
    "jieba>=0.42.1",
    "requests>=2.31",
    "pytest>=7.4",
]
corpus = ["sentence-transformers>=2.2", "scikit-learn>=1.3"]
# 代码风格门禁（CI lint job 用同一个钉死的版本，本地与 CI 结论一致）
lint = ["ruff==0.14.14"]

[tool.setuptools.dynamic]
version = { attr = "idiolect.__version__" }

[tool.setuptools.packages.find]
include = ["idiolect*"]
namespaces = false

# turn_logic 的纯数据目录已迁到角色包 data/*.json（2026-09）——
# 作为 package-data 进 wheel，importlib.resources 才能在读 installed 包时定位。
[tool.setuptools.package-data]
"idiolect.characters.anon.data" = ["*.json"]
"idiolect.characters.tomori.data" = ["*.json"]
# 评测合同的内置 suite / 回放 / 长上下文计划 / 快照样例，以及离线 inspect 报告模板（v0.1.2）
"idiolect.benchmarks" = ["*.json"]
"idiolect.evals" = ["*.html"]

# 代码风格门禁（CI 的 lint job；本地：pip install "idiolect[lint]" 后 ruff check .）。
# 选的是「正确性 + 机械格式」规则，不是全量风格重排：E402 是 tools/ 有意的 sys.path 引导，
# 导入排序与 pyupgrade 改写会在 prompt 模块里制造大面积无关 diff，所以不开。
# 注释风格（中文 docstring、注释格式、繁体字、纯英文注释）由 tools/gates/style_gate.py 检查。
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["report", "raw", ".workbuddy", "build", "dist"]

[tool.ruff.lint]
select = [
    "E9", "E501", "E711", "E712", "E713", "E714", "E721", "E722",
    "F",
    "W",
    "B006", "B007", "B008", "B009", "B010", "B012", "B018", "B023",
]

[tool.ruff.lint.per-file-ignores]
# 角色包正文是 prompt 素材：长行几乎都是中文注入正文，重排有 prompt 漂移风险。新模块不豁免。
"idiolect/characters/**" = ["E501"]
