[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "idiolect"
dynamic = ["version"]
description = "把角色的说话方式蒸馏成可验证的 prompt 约束（示例角色：《BanG Dream! It's MyGO!!!!!》五人）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["prompt-engineering", "character-ai", "roleplay", "llm", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 运行时零第三方依赖：idiolect/ 只用标准库。
# 探针、评分等工具链见 extras 与 requirements*.txt。
dependencies = []

# 装了包就有一个 `idiolect` 命令，等于 `python -m idiolect`。
# 这样 `uvx --from git+https://github.com/<owner>/idiolect idiolect prompt Rana "…"`
# 这种一行调用才成立（uv 会建一个临时环境，运行时零依赖）。
[project.scripts]
idiolect = "idiolect.__main__:main"

[project.optional-dependencies]
llm = ["openai>=1.40"]
tools = [
    "openai>=1.40",
    "numpy>=1.24",
    "jieba>=0.42.1",
    "requests>=2.31",
    "pytest>=7.4",
]
corpus = ["sentence-transformers>=2.2", "scikit-learn>=1.3"]

[tool.setuptools.dynamic]
version = { attr = "idiolect.__version__" }

[tool.setuptools.packages.find]
include = ["idiolect*"]
namespaces = false

# turn_logic 的纯数据目录已迁到角色包 data/*.json（2026-09）——
# 作为 package-data 进 wheel，importlib.resources 才能在读 installed 包时定位。
[tool.setuptools.package-data]
"idiolect.characters.anon.data" = ["*.json"]
"idiolect.characters.tomori.data" = ["*.json"]
