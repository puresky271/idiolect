# CI：离线健康检查是本仓库的质量总闸（见 tools/offline_smoke.py docstring）。
# 不调 LLM、不读语料（两者在 CI 环境天然缺席，smoke 会 SKIP 而非 FAIL），
# mock 时钟固定，所以跑的是全确定性的那一层：装配 + 红线 + 门禁 + 单测 + 零写校验。
#
# 矩阵：ubuntu 全覆盖支持版本（3.11–3.13，见 pyproject classifiers）；
# windows 只跑 3.12 —— 仓库在 Windows 上开发，留一个 Windows 探针防止平台专属回归，
# 不为它付三倍的 runner 时间。
#
# wheel 单独一个 job：验证角色包 data/*.json 与评测内置数据真的进了发行物（package-data
# 配置一旦漏掉，装完的包会在 importlib.resources 处大声报错——但那要等用户装完才发现，
# 这里提前到每次 push）。随后在仓库之外的干净 venv 里 `--no-deps` 安装 wheel，验证
# 运行时零第三方依赖、离线评测四种能力模式与同链自测在没有 tools/ 的环境里照样可跑。
#
# lint 单独一个 job：ruff（钉死版本，与 pyproject 的 lint extra 一致）查代码正确性与机械格式，
# tools/gates/style_gate.py 查注释风格（中文 docstring、注释格式、繁体字、纯英文注释）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"          # 中文语料文本，全链路强制 UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖与包本体
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .
      - name: 离线 smoke（装配 + 红线 + 数据 + 门禁 + 单测 + 零写校验）
        run: python -X utf8 tools/offline_smoke.py
      # smoke 的 PASS 明细平时只躺在 gitignore 的 report/ 里；把它搬进 job summary，
      # 「自检真的跑过」在 CI 页面上就有据可查（2026-09-13 评审 S4）
      - name: smoke 摘要写进 job summary
        if: always()
        shell: bash
        run: |
          if [ -f report/offline_smoke.md ]; then
            cat report/offline_smoke.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "（offline_smoke 未产出摘要文件）" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: 校验角色包数据与评测内置数据进了 wheel
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "dist/ 下没有 wheel 产物"
          names = zipfile.ZipFile(wheels[0]).namelist()
          need = [
              "characters/anon/data/cosmetics.json",
              "characters/anon/data/fashion.json",
              "characters/anon/data/social_media.json",
              "characters/tomori/data/marine_life.json",
              "benchmarks/spatiotemporal-core.json",
              "benchmarks/spatiotemporal-core.replay.healthy.json",
              "benchmarks/language-only.json",
              "benchmarks/mygo-five-showcase.json",
              "benchmarks/long-context-smoke.plan.json",
              "benchmarks/snapshot.example.json",
              "evals/inspect_template.html",
          ]
          missing = [n for n in need if not any(name.endswith(n) for name in names)]
          assert not missing, f"包数据缺席 wheel（package-data 配置漂了）：{missing}"
          print(f"wheel 数据校验 OK：{len(names)} 个文件，{len(need)} 项包数据全在")
          EOF
      - name: 干净 venv 安装 wheel（--no-deps）并跑离线评测
        shell: bash
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp            # 离开仓库：确认不依赖 tools/ 与源码树
          export PYTHONUTF8=1 IDIOLECT_REPORT_DIR=/tmp/idiolect-report
          PY=/tmp/wheelenv/bin/python
          $PY -c "import sys, idiolect.evals, idiolect.workspace; bad=[m for m in ('openai','numpy','jieba','requests') if m in sys.modules]; assert not bad, bad"
          $PY -m idiolect capabilities
          $PY -m idiolect contract validate builtin:snapshot.example
          $PY -m idiolect eval --suite language-only --responses builtin:language-only.healthy
          $PY -m idiolect eval --suite spatiotemporal-core --responses builtin:spatiotemporal-core.healthy --capabilities spatiotemporal --html
          $PY -m idiolect eval --suite long-context-smoke --responses builtin:long-context-smoke.healthy --capabilities long-context-stress
          $PY -m idiolect eval --suite long-context-smoke --responses builtin:long-context-smoke.healthy --capabilities long-context-stress,spatiotemporal
          # 负对照：带缺陷的回放必须让门禁非零退出
          if $PY -m idiolect eval --suite spatiotemporal-core --responses builtin:spatiotemporal-core.defects --capabilities spatiotemporal --no-save; then
            echo "缺陷回放竟然通过了门禁" && exit 1
          fi
          $PY -m idiolect selftest

  lint:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff（钉死版本）
        run: python -m pip install "ruff==0.14.14"
      - name: 代码风格（ruff：pyflakes + 机械格式）
        run: ruff check --output-format github .
      - name: 注释风格（中文 docstring / 注释格式 / 繁体字 / 纯英文注释）
        run: python -X utf8 tools/gates/style_gate.py
